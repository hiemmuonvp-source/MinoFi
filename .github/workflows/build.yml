name: Build MinoFi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Chap nhan license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Tao google-services.json tu Secret
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" | base64 -d > app/google-services.json
            echo "Da tao app/google-services.json tu Secret"
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::Khong co google-services.json -> APK build duoc nhung KHONG co FCM"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MinoFi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
